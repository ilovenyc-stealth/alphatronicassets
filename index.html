<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resistors & Capacitors – Finder & Color Code Calculator</title>
<style>
/* ===== BRAND COLOURS – replace these 6 hex values with alphatronic.lk's exact colours ===== */
:root{
  --brand:#1a6cf0;      /* 'Shop now' blue – buttons, active states */
  --brand-dark:#0f55c7; /* hover */
  --accent:#1a6cf0;     /* highlights, focus */
  --bg:#f3f5f9;         /* page background */
  --card:#ffffff;       /* cards */
  --ink:#0b1220;        /* text */
  --muted:#5d6a80;
  --line:#dde3ee;
}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#18202e;--ink:#e8edf6;--muted:#9aa7bd;--line:#2a3548;--brand:#4d8ff5;--accent:#4d8ff5}}
*{box-sizing:border-box}
header{background:#fff;color:#0b1220}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
h1{margin:0;font-size:1rem}.logo{display:block;line-height:0}.logo img{height:48px;width:auto;display:block}
.hot{text-align:right;font-size:.8rem;line-height:1.25;color:#5a6577}.hot b{display:block;font-size:1rem;color:#000;white-space:nowrap}
.bar{background:#0071df}
.bar .wrap{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px}
.bar button{background:transparent;color:#fff;border:0;border-bottom:3px solid transparent;padding:12px 18px;font:inherit;font-weight:700;text-transform:uppercase;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.12)}
.bar button[aria-selected=true]{border-bottom-color:#fff;background:rgba(255,255,255,.14)}
.bar :focus-visible{outline-color:#fff}
body{margin:0;display:flex;flex-direction:column;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding:12px 16px;width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
#p-find{flex:1;min-height:0;display:flex;flex-direction:column}
body.fit{height:100dvh;overflow:hidden}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;gap:6px}
main .search input{border-radius:999px;padding:11px 18px}
.seg button{font:inherit;font-weight:600;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.search input,.calc input,.calc select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.search input{flex:1;min-width:220px}
#msg{color:var(--muted);margin:0 0 8px}#msg:empty{display:none}
#msg b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);gap:8px;flex:1;min-height:0}
.tile{display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:0;min-height:0}
.tile svg{width:100%;height:100%}
@media (max-width:1000px) and (min-width:701px){.grid.cap{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(9,1fr)}}
.grid.cap{grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(6,1fr)}
@media (max-width:1000px) and (min-width:701px){.grid.cap{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(9,1fr)}}
@media (max-width:700px){.grid.cap{grid-template-columns:repeat(4,1fr);grid-template-rows:none;grid-auto-rows:68px;overflow-y:auto;align-content:start}}
@media (max-width:700px){.grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(9,1fr);gap:6px}}
.cc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.ctitle{font-size:1.4rem;margin:0 0 12px}
.cc h3{margin:0 0 8px;font-size:1.05rem}
.ctabs{display:flex;gap:28px;border-bottom:1px solid var(--ink);margin-bottom:22px}
.ctabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 6px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:-1px}
.ctabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:600}
.ccols{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.diagram{position:relative}.diagram svg{width:100%;height:auto;display:block}
.pick{position:absolute;inset:0}
.bsel{position:absolute;left:var(--x);top:77%;transform:translateX(-50%)}
.bbtn{width:42px;padding:6px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.8rem;display:flex;gap:4px;align-items:center;justify-content:center;cursor:pointer}
.bbtn .lbl{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);flex:none}
.menu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:190px;max-height:260px;overflow:auto;padding:4px}
.menu.r{left:auto;right:0;transform:none}
.menu button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 8px;border:0;background:none;color:var(--ink);font:inherit;font-size:.9rem;text-align:left;cursor:pointer;border-radius:5px}
.menu button:hover,.menu button:focus-visible{background:var(--bg)}
.menu .h{margin-left:auto;color:var(--muted);font-size:.8rem}
.rv{font-size:2rem;font-weight:700;margin:0 0 14px;line-height:1.2}
.rv .val{color:var(--brand)}
.fl{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;margin:12px 0 4px}
.vrow{display:flex}.vrow input{flex:1;min-width:0;border-radius:6px 0 0 6px}.vrow select{border-left:0;border-radius:0 6px 6px 0}
.cc select{width:auto}.cc #ctol{width:100%}.vrow select{flex:none;width:88px}
#cerr{color:var(--no,#c0392b);min-height:1.2em;font-size:.85rem;margin-top:4px}
#cinfo{color:var(--muted);font-size:.9rem;margin-top:10px;line-height:1.7}
#creset{margin-top:12px;font:inherit;padding:7px 14px;border:1px solid var(--brand);background:var(--card);color:var(--brand);border-radius:6px;cursor:pointer}
@media (max-width:640px){
 .ccols{grid-template-columns:1fr}
 .pick{position:static;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
 .bsel{position:relative;left:auto;top:auto;transform:none}
 .bbtn{width:auto;padding:7px 10px}.bbtn .lbl{display:inline}
 .conn{display:none}.menu,.menu.r{left:0;right:auto;transform:none}
 .ctabs{gap:14px}
}
[hidden]{display:none!important}
</style>
</head>

<script>
/* ===== CATALOGUE (same 35 values as the product page) ===== */
const LABELS=["3.3","5.6","10","12","15","18","22","33","39","47","56","68","82","100","110","220","330","470","1K","1.5K","2.2K","4.7K","10K","12K","22K","39K","56K","100K","200K","220K","390K","1M","2.2M","3M","10M"];
const TOL_DEFAULT="gold";   // tolerance band drawn on cards (gold = ±5%) – change if your stock is 1%

/* ===== COLOUR DATA ===== */
const COL={black:{h:"#111",d:0,m:1},brown:{h:"#7b3f00",d:1,m:10,t:1,tc:100},red:{h:"#d62828",d:2,m:1e2,t:2,tc:50},
orange:{h:"#f77f00",d:3,m:1e3,tc:15},yellow:{h:"#fcd116",d:4,m:1e4,tc:25},green:{h:"#2a9d3f",d:5,m:1e5,t:.5},
blue:{h:"#1d4ed8",d:6,m:1e6,t:.25,tc:10},violet:{h:"#7e22ce",d:7,m:1e7,t:.1,tc:5},grey:{h:"#8d8d8d",d:8,m:1e8,t:.05},
white:{h:"#fafafa",d:9,m:1e9},gold:{h:"#d4a017",m:.1,t:5},silver:{h:"#c0c0c0",m:.01,t:10}};
const ALIAS={gray:"grey",purple:"violet"};
const DIG=["black","brown","red","orange","yellow","green","blue","violet","grey","white"];
const MULT=[...DIG,"gold","silver"], TOL=["brown","red","green","blue","violet","grey","gold","silver"], TC=["brown","red","orange","yellow","blue","violet"];
const MEXP={silver:-2,gold:-1};DIG.forEach((c,i)=>MEXP[c]=i);

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const toOhms=l=>{const m=l.match(/^([\d.]+)([KM]?)$/);return parseFloat(m[1])*({K:1e3,M:1e6}[m[2]]||1)};
const trim=n=>String(+n.toFixed(3));
const fmt=o=>o>=1e6?trim(o/1e6)+" MΩ":o>=1e3?trim(o/1e3)+" kΩ":trim(o)+" Ω";
const ITEMS=LABELS.map(l=>({l,o:toOhms(l)}));
function bandsFor(o,n,tol=TOL_DEFAULT){
  const nd=n===4?2:3, e=Math.floor(Math.log10(o))-(nd-1);let d=Math.round(o/10**e),ex=e;
  if(d>=10**nd){d=Math.round(d/10);ex++}
  if(ex<-2||ex>9)return null;
  const ds=String(d).padStart(nd,"0").split("").map(x=>DIG[+x]);
  return [...ds,MULT[ex>=0?ex:ex===-1?10:11],tol];
}
function valueOf(b){if(b.length===3)return(COL[b[0]].d*10+COL[b[1]].d)*COL[b[2]].m;
  return(COL[b[0]].d*100+COL[b[1]].d*10+COL[b[2]].d)*COL[b[3]].m}
function parseVal(s){
  s=s.toLowerCase().replace(/ohms?|[Ωω]/g,"").replace(/[\s,]/g,"");
  const m=s.match(/^(\d+(?:\.\d+)?)([kmgr])?(\d+)?$/);if(!m||(m[3]&&!m[2]))return null;
  return parseFloat(m[3]?m[1]+"."+m[3]:m[1])*({k:1e3,m:1e6,g:1e9,r:1}[m[2]||"r"]);
}
function parseColors(s){
  const w=s.toLowerCase().split(/[\s,\-\/]+/).filter(Boolean).map(x=>ALIAS[x]||x);
  if(w.length<3||w.length>6||!w.every(x=>COL[x]))return null;
  const nd=w.length>=5?3:2;
  if(w.slice(0,nd).some(c=>COL[c].d===undefined)||COL[w[nd]].m===undefined)return null;
  return valueOf(nd===3?w.slice(0,nd+1):w.slice(0,3));
}
function svg(b){
  const main=b.length===4?3:4,sp=[];
  let x="";b.forEach((c,i)=>{const px=i<main?54+i*18:136+(i-main)*18;
    x+=`<rect x="${px}" y="11" width="9" height="38" fill="${COL[c].h}" ${c==="white"?'stroke="#bbb" stroke-width=".8"':""}><title>${c}</title></rect>`});
  return `<svg viewBox="0 0 220 60" role="img" aria-label="Bands: ${b.join(", ")}"><line x1="2" y1="30" x2="218" y2="30" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
  <rect x="38" y="9" width="144" height="42" rx="16" fill="#e5cfa0"/>${x}</svg>`;
}

/* ===== CAPACITOR DATA (through-hole parts from alphatronic.lk/product-category/passive/capacitors) ===== */
const fmtC=pf=>pf<1e4?trim(pf)+"pF":trim(pf/1e6)+"µF";
const CAPS=[];
[[10,"100"],[100,"101"],[1000,"102"],[2200,"222"],[3300,"333"],[1e4,"103"]].forEach(([pf,c])=>CAPS.push({k:"cer",pf,v:50,code:c}));
CAPS.push({k:"cer",pf:47000,v:100,code:"2A473J"},{k:"cer",pf:1e5,v:50,code:"104"},{k:"cer",pf:470000,v:100,code:"2A474J"});
"0.22,50 1,50 2.2,50 3.3,50 4.7,50 10,16 10,25 10,50 22,18 22,25 33,16 33,25 33,50 47,16 47,50 100,16 100,25 100,50 100,100 220,16 220,25 220,50 330,25 330,50 470,16 470,25 470,50 470,100 680,16 680,25 680,50 1000,16 1000,25 1000,50 2200,25 3300,25 3300,50 4700,18 4700,25 4700,50"
  .split(" ").forEach(x=>{const [u,v]=x.split(",");CAPS.push({k:"el",pf:Math.round(u*1e6),v:+v})});
CAPS.push({k:"film",pf:3.3e6,v:250});
CAPS.forEach(c=>{c.l=fmtC(c.pf)+(c.k==="cer"?"":" "+c.v+"V");c.n=(fmtC(c.pf)+(c.v?c.v+"v":"")+(c.code||"")).toLowerCase().replace("µ","u")});
const T='font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle"';
function capCard(c){
  const t=fmtC(c.pf),big=t.length>=6?30:34,lead=x=>`<line x1="${x}" y1="78" x2="${x}" y2="106" stroke="#9aa3ad" stroke-width="6" stroke-linecap="round"/>`;let b;
  if(c.k==="el")b=lead(56)+lead(110)+`<rect x="4" y="4" width="152" height="76" rx="14" fill="#1f3a68"/><rect x="4" y="4" width="14" height="76" rx="7" fill="#cfd8e6"/><text x="88" y="46" font-size="${big}" fill="#fff" ${T}>${t}</text><text x="88" y="71" font-size="23" fill="#cfe1ff" ${T}>${c.v}V</text>`;
  else if(c.k==="cer")b=lead(60)+lead(100)+`<ellipse cx="80" cy="42" rx="74" ry="40" fill="#e8a33d"/><text x="80" y="42" font-size="${t.length>6?25:30}" fill="#2b1c08" ${T}>${t}</text><text x="80" y="68" font-size="21" fill="#2b1c08" ${T}>${c.code}</text>`;
  else b=lead(44)+lead(116)+`<rect x="4" y="4" width="152" height="76" rx="10" fill="#b5322a"/><text x="80" y="46" font-size="34" fill="#fff" ${T}>${t}</text><text x="80" y="71" font-size="23" fill="#ffd9d4" ${T}>${c.v}V</text>`;
  return `<div class="tile"><svg viewBox="0 0 160 110" role="img" aria-label="${c.l}">${b}</svg></div>`;
}

/* ===== FIND TAB ===== */
let mode="res";
function card(it){
  const t=fmt(it.o).replace(" ","");
  return `<div class="tile"><svg viewBox="0 0 160 56" role="img" aria-label="${t}"><line x1="2" y1="28" x2="158" y2="28" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/><rect x="20" y="6" width="120" height="44" rx="16" fill="#e5cfa0"/><text x="80" y="29" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#2b2118" font-family="system-ui,sans-serif">${t}</text></svg></div>`;
}
function searchRes(q){
  if(!q)return{list:ITEMS,msg:""};
  let v=parseVal(q),fromColor=false;
  if(v===null){v=parseColors(q);fromColor=v!==null}
  if(v!==null&&v>0){
    const ex=ITEMS.filter(i=>Math.abs(i.o-v)/v<1e-9);
    if(ex.length)return{list:ex,msg:`<b>Exact match:</b> ${fmt(v)}${fromColor?" (from colour bands)":""}`};
    const lo=ITEMS.filter(i=>i.o<v).pop(),hi=ITEMS.find(i=>i.o>v),list=[lo,hi].filter(Boolean);
    return{list,msg:`<b>${fmt(v)}</b> is not listed. Closest values we carry: ${list.map(i=>fmt(i.o)).join(" and ")}.`};
  }
  const t=q.toLowerCase(),list=ITEMS.filter(i=>i.l.toLowerCase().includes(t)||fmt(i.o).toLowerCase().includes(t));
  return{list,msg:list.length?`${list.length} match${list.length>1?"es":""}`:`No match for “${q}”. Try 4.7k, 4k7, 4700 or colours like “yellow violet red”.`};
}
function searchCap(q){
  if(!q)return{list:CAPS,msg:""};
  let s=q.toLowerCase().replace(/[\s,]/g,"").replace(/[µμ]/g,"u"),volt=null;
  const vm=s.match(/(\d+(?:\.\d+)?)v/);if(vm){volt=parseFloat(vm[1]);s=s.replace(vm[0],"")}
  if(!s&&volt!==null){const l=CAPS.filter(c=>c.v===volt);return{list:l,msg:l.length?`${l.length} capacitor${l.length>1?"s":""} rated ${volt}V`:`Nothing rated ${volt}V.`}}
  const eq=(a,b)=>Math.abs(a-b)/Math.max(b,1e-12)<1e-9;
  const m=s.match(/^(\d+(?:\.\d+)?)([pnu])(\d+)?f?$/),b=s.match(/^(\d+(?:\.\d+)?)f?$/);let T=null;
  if(m)T=[parseFloat(m[3]?m[1]+"."+m[3]:m[1])*{p:1,n:1e3,u:1e6}[m[2]]];else if(b)T=[b[1]*1e6,+b[1]];
  if(T){
    const ex=CAPS.filter(c=>T.some(t=>eq(c.pf,t))||c.code===s.toUpperCase()||c.code===s);
    if(ex.length){
      const name=fmtC(ex[0].pf);
      if(volt!==null){const bv=ex.filter(c=>c.v===volt);
        if(bv.length)return{list:bv,msg:`<b>Exact match:</b> ${name} ${volt}V`};
        return{list:ex,msg:`<b>${name}</b> isn't listed at ${volt}V. Available: ${ex.map(c=>c.v+"V").join(", ")}.`}}
      return{list:ex,msg:`<b>Exact match:</b> ${name}${ex.length>1?` – ${ex.length} versions`:""}`};
    }
    const vals=[...new Set(CAPS.map(c=>c.pf))].sort((a,b)=>a-b),t=T[0],lo=vals.filter(x=>x<t).pop(),hi=vals.find(x=>x>t);
    const list=CAPS.filter(c=>c.pf===lo||c.pf===hi);
    return{list,msg:`<b>${fmtC(t)}</b> is not listed. Closest values we carry: ${[lo,hi].filter(x=>x!==undefined).map(fmtC).join(" and ")}.`};
  }
  const l=CAPS.filter(c=>c.n.includes(s));
  return{list:l,msg:l.length?`${l.length} match${l.length>1?"es":""}`:`No match for “${q}”. Try 100uF, 4u7, 10n, 25V or a code like 103.`};
}
function render(){
  const q=$("#q").value.trim(),r=mode==="res"?searchRes(q):searchCap(q);
  $("#msg").innerHTML=r.msg;$("#grid").className="grid "+mode;
  $("#grid").innerHTML=r.list.map(mode==="res"?card:capCard).join("");
}
$("#q").addEventListener("input",render);
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;$("#q").value="";
  document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});

/* ===== CALCULATOR ===== */
let n=4,open=null;const st={d:[null,null,null],m:null,t:null,tc:null};
const XS={4:[58,108,250,392],5:[56,92,128,250,392],6:[56,92,128,250,380,418]};
const BODY="M40 20H96Q104 20 108 30Q112 38 122 38H358Q368 38 372 30Q376 20 384 20H440Q452 20 452 32V98Q452 110 440 110H384Q376 110 372 100Q368 92 358 92H122Q112 92 108 100Q104 110 96 110H40Q28 110 28 98V32Q28 20 40 20Z";
const spec=()=>{const nd=n===4?2:3,L=[];for(let i=0;i<nd;i++)L.push({k:"d",i,t:["1st digit","2nd digit","3rd digit"][i],o:DIG});
  L.push({k:"m",t:"Multiplier",o:MULT},{k:"t",t:"Tolerance",o:TOL});if(n===6)L.push({k:"tc",t:"Temp. coeff.",o:TC});return L};
const get=b=>b.k==="d"?st.d[b.i]:st[b.k], put=(b,c)=>{if(b.k==="d")st.d[b.i]=c;else st[b.k]=c};
const mf=m=>m>=1e9?"1G":m>=1e6?m/1e6+"M":m>=1e3?m/1e3+"k":String(m);
const hint=(k,c)=>{const o=COL[c];return k==="d"?String(o.d):k==="m"?"×"+mf(o.m):k==="t"?"±"+o.t+"%":o.tc+" ppm/K"};
function ohms(){const nd=n===4?2:3,ds=st.d.slice(0,nd);if(!ds.every(Boolean)||!st.m)return null;return ds.reduce((a,c)=>a*10+COL[c].d,0)*COL[st.m].m}
function drawCalc(){
  const L=spec(),X=XS[n];let bands="",conn="",pick="";
  L.forEach((b,i)=>{const c=get(b),r=i>=L.length-2;
    bands+=`<rect x="${X[i]-11}" y="0" width="22" height="200" clip-path="url(#bc)" fill="${c?COL[c].h:"rgba(255,255,255,.65)"}"/>`;
    conn+=`<line class="conn" x1="${X[i]}" x2="${X[i]}" y1="110" y2="150" stroke="#d3d9e4" stroke-width="2"/>`;
    pick+=`<div class="bsel" style="--x:${(X[i]/4.8).toFixed(2)}%"><button class="bbtn" data-i="${i}" aria-haspopup="listbox" aria-expanded="${open===i}" aria-label="${b.t}: ${c||"not set"}"><span class="dot" style="background:${c?COL[c].h:"transparent"}"></span><span class="lbl">${b.t}</span>▾</button>`
     +(open===i?`<div class="menu ${r?"r":""}" role="listbox">${b.o.map(x=>`<button data-i="${i}" data-c="${x}" role="option"><span class="dot" style="background:${COL[x].h}"></span>${x[0].toUpperCase()+x.slice(1)}<span class="h">${hint(b.k,x)}</span></button>`).join("")}</div>`:"")+`</div>`});
  $("#cdiag").innerHTML=`<svg viewBox="0 0 480 170" role="img" aria-label="Resistor with ${L.length} colour bands"><defs><clipPath id="bc"><path d="${BODY}"/></clipPath></defs>
   <rect x="8" y="52" width="20" height="26" fill="#cfcfcf" stroke="#999" stroke-width="2"/><rect x="452" y="52" width="20" height="26" fill="#cfcfcf" stroke="#999" stroke-width="2"/>
   <path d="${BODY}" fill="#e7dfd3"/>${bands}<path d="${BODY}" fill="none" stroke="#9a9a9a" stroke-width="3"/>${conn}</svg><div class="pick">${pick}</div>`;
  const o=ohms(),t=st.t?COL[st.t].t:null;
  $("#cval").textContent=o==null?"–":fmt(o)+(t?` ±${t}%`:"");
  let info="";
  if(o!=null){const it=ITEMS.find(i=>o>0&&Math.abs(i.o-o)/o<1e-9);
    if(t)info+=`Range: ${fmt(o*(1-t/100))} to ${fmt(o*(1+t/100))}<br>`;
    if(n===6&&st.tc)info+=`Temp. coefficient: ${st.tc&&COL[st.tc].tc} ppm/K<br>`;
    info+=`Alphatronic 1/4W listing: <strong>${it?fmt(o)+" – listed":"not in the listed range"}</strong>`}
  $("#cinfo").innerHTML=info;
}
function syncInput(o){if(!(o>0))return;const u=o>=1e9?["g",1e9]:o>=1e6?["m",1e6]:o>=1e3?["k",1e3]:["",1];
  $("#cin").value=trim(o/u[1]);$("#cunit").value=u[0];$("#cerr").textContent="";if(st.t&&TOL.includes(st.t))$("#ctol").value=st.t}
function fromInput(){
  const raw=$("#cin").value.trim();$("#cerr").textContent="";if(!raw){return}
  const v=parseVal(/[a-z]/i.test(raw)?raw:raw+$("#cunit").value);
  if(v===null||!(v>0)){$("#cerr").textContent="Enter a value such as 4.7, 4k7 or 330.";return}
  const b=bandsFor(v,n,$("#ctol").value);if(!b){$("#cerr").textContent="That value is outside the range colour bands can show.";return}
  const nd=b.length-2,num=b.slice(0,nd).reduce((a,c)=>a*10+COL[c].d,0)*COL[b[nd]].m;
  if(Math.abs(num-v)/v>1e-9){$("#cerr").textContent=`${fmt(v)} can't be shown exactly with ${n} bands${n===4?" – try 5 or 6 bands":""}.`;return}
  for(let i=0;i<nd;i++)st.d[i]=b[i];st.m=b[nd];st.t=b[nd+1];drawCalc();
}
$("#cdiag").addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;const i=+x.dataset.i,L=spec();
  if(x.dataset.c){put(L[i],x.dataset.c);open=null;drawCalc();const o=ohms();if(o!=null)syncInput(o)}
  else{open=open===i?null:i;drawCalc();if(open!==null){const f=$("#cdiag .menu button");f&&f.focus()}}});
document.addEventListener("click",e=>{if(open!==null&&!e.target.closest(".bsel")){open=null;drawCalc()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&open!==null){open=null;drawCalc()}});
document.querySelectorAll("#ctabs button").forEach(b=>b.onclick=()=>{n=+b.dataset.n;open=null;
  document.querySelectorAll("#ctabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("#ctitle").textContent=`${n} Band Resistor Colour Code Calculator`;
  if($("#cin").value.trim())fromInput();drawCalc()});
$("#cin").addEventListener("input",fromInput);$("#cunit").addEventListener("change",fromInput);$("#ctol").addEventListener("change",()=>{if($("#cin").value.trim())fromInput();else if(st.t){st.t=$("#ctol").value;drawCalc()}});
$("#creset").onclick=()=>{st.d=[null,null,null];st.m=st.t=st.tc=null;$("#cin").value="";$("#cerr").textContent="";open=null;drawCalc()};

/* ===== TABS ===== */
[["find","calc"],["calc","find"]].forEach(([a,o])=>$("#t-"+a).onclick=()=>{
  $("#p-"+a).hidden=false;$("#p-"+o).hidden=true;
  $("#t-"+a).setAttribute("aria-selected",true);$("#t-"+o).setAttribute("aria-selected",false);document.body.classList.toggle("fit",a==="find");if(a==="calc")drawCalc();else render()});
render();drawCalc();
</script>
</body>
